receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: packetsorter
          scrape_interval: 5s
          metrics_path: /metrics
          static_configs:
            - targets: ["host.docker.internal:8080"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  otlp/weaver:
    endpoint: host.docker.internal:4319
    tls:
      insecure: true
    compression: none

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/weaver]
