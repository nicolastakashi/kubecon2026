file_format: definition/2
attributes:
- key: code
  type: string
  examples:
  - '200'
  - '500'
  - '503'
  brief: ''
  stability: development
- key: endpoint
  type: string
  examples:
  - /api/parcels
  - /api/parcels/{id}
  - /api/parcels/{id}/process
  - /api/parcels/{id}/ship
  brief: ''
  stability: development
- key: method
  type: string
  examples:
  - GET
  - POST
  brief: ''
  stability: development
- key: outcome
  type: string
  examples:
  - drop
  - ok
  - rework
  - success
  brief: ''
  stability: development
- key: reason
  type: string
  examples:
  - damaged
  - inspection
  - weight_issue
  - wrong_address
  brief: ''
  stability: development
- key: server.address
  type: string
  examples: host.docker.internal
  brief: ''
  stability: development
- key: server.port
  type: string
  examples: '8080'
  brief: ''
  stability: development
- key: service.instance.id
  type: string
  examples: host.docker.internal:8080
  brief: ''
  stability: development
- key: service.name
  type: string
  examples: packetsorter
  brief: ''
  stability: development
- key: stage
  type: string
  examples:
  - ingested
  - ready_to_ship
  brief: ''
  stability: development
- key: status
  type: string
  examples:
  - '200'
  - '201'
  - '404'
  - '400'
  brief: ''
  stability: development
- key: url.scheme
  type: string
  examples: http
  brief: ''
  stability: development
metrics:
- name: http_request_duration_seconds
  instrument: histogram
  unit: ''
  attributes:
  - ref: endpoint
  - ref: method
  brief: ''
  stability: development
- name: http_requests_total
  instrument: counter
  unit: ''
  attributes:
  - ref: endpoint
  - ref: method
  - ref: status
  brief: ''
  stability: development
- name: parcels_backlog
  instrument: gauge
  unit: ''
  attributes:
  - ref: stage
  brief: ''
  stability: development
- name: parcels_total
  instrument: counter
  unit: ''
  attributes:
  - ref: outcome
  - ref: stage
  brief: ''
  stability: development
- name: process_cpu_seconds_total
  instrument: counter
  unit: ''
  brief: ''
  stability: development
- name: process_max_fds
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: process_open_fds
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: process_resident_memory_bytes
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: process_start_time_seconds
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: process_virtual_memory_bytes
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: process_virtual_memory_max_bytes
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: promhttp_metric_handler_requests_in_flight
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: promhttp_metric_handler_requests_total
  instrument: counter
  unit: ''
  attributes:
  - ref: code
  brief: ''
  stability: development
- name: rework_reason_total
  instrument: counter
  unit: ''
  attributes:
  - ref: reason
  brief: ''
  stability: development
- name: scrape_duration_seconds
  instrument: gauge
  unit: s
  brief: ''
  stability: development
- name: scrape_samples_post_metric_relabeling
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: scrape_samples_scraped
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: scrape_series_added
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
- name: stage_duration_seconds
  instrument: histogram
  unit: ''
  attributes:
  - ref: stage
  brief: ''
  stability: development
- name: up
  instrument: gauge
  unit: ''
  brief: ''
  stability: development
