groups:
- id: resource
  type: entity
  brief: ''
  stability: development
  attributes:
  - id: server.address
    type: string
    brief: ''
    examples: host.docker.internal
    requirement_level: recommended
    note: ''
    stability: development
    annotations: null
  - id: server.port
    type: string
    brief: ''
    examples: '8080'
    requirement_level: recommended
    note: ''
    stability: development
    annotations: null
  - id: service.instance.id
    type: string
    brief: ''
    examples: host.docker.internal:8080
    requirement_level: recommended
    note: ''
    stability: development
    annotations: null
  - id: service.name
    type: string
    brief: ''
    examples: packetsorter
    requirement_level: recommended
    note: ''
    stability: development
    annotations: null
  - id: url.scheme
    type: string
    brief: ''
    examples: http
    requirement_level: recommended
    note: ''
    stability: development
    annotations: null
- id: metric.up
  type: metric
  brief: ''
  stability: development
  metric_name: up
  instrument: gauge
- id: metric.process_virtual_memory_bytes
  type: metric
  brief: ''
  stability: development
