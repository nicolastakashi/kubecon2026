name: E2E & Contract Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: make test

      - name: Build application
        run: make build

      - name: Run E2E tests
        run: |
          ./bin/packetsorter &
          APP_PID=$!
          sleep 2
          
          cd test/e2e && go test -v . -timeout=120s
          E2E_EXIT=$?
          
          kill $APP_PID 2>/dev/null || true
          exit $E2E_EXIT

      - name: Run contract tests (live-check)
        run: make live-check
