name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: packetsorter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: packetsorter-e2e
          version: v0.31.0
          wait: 60s

      - name: Load image into Kind
        run: |
          kind load docker-image packetsorter:latest --name packetsorter-e2e

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f test/e2e/manifests/

      - name: Wait for deployment
        run: |
          kubectl wait --for=condition=available deployment/packetsorter -n packetsorter --timeout=60s

      - name: Run e2e tests
        run: |
          kubectl port-forward -n packetsorter svc/packetsorter 8080:8080 > /dev/null 2>&1 &
          PORT_FORWARD_PID=$!
          echo "Port-forward started (PID: $PORT_FORWARD_PID)"
          sleep 3
          cd test/e2e && go test -v . -timeout=120s
          EXIT_CODE=$?
          kill $PORT_FORWARD_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Cleanup Kind cluster
        if: always()
        run: |
          kind delete cluster --name packetsorter-e2e || true
