name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linters
        run: make lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  contract-test:
    name: Contract Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate telemetry contract
        continue-on-error: true
        id: contract_test
        run: |
          set +e -o pipefail
          OUTPUT_FILE=$(mktemp)
          SUMMARY_FILE=$(mktemp)
          LIVE_CHECK_SUMMARY_FILE="$SUMMARY_FILE" make live-check 2>&1 | tee "$OUTPUT_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          COMMENT_OUTPUT=$(cat "$SUMMARY_FILE")
          if [ -z "$COMMENT_OUTPUT" ]; then
            COMMENT_OUTPUT=$(awk '
              { lines[NR] = $0 }
              END {
                start = NR - 39
                if (start < 1) {
                  start = 1
                }
                for (i = start; i <= NR; i++) {
                  print lines[i]
                }
              }
            ' "$OUTPUT_FILE")
          fi
          DELIM="CONTRACT_TEST_$(date +%s)_$$"
          {
            echo "output<<$DELIM"
            printf '%s\n' "$COMMENT_OUTPUT"
            echo "$DELIM"
            echo "exit_code=$EXIT_CODE"
          } >> "$GITHUB_OUTPUT"
          rm -f "$OUTPUT_FILE"
          rm -f "$SUMMARY_FILE"
          exit 0

      - name: Comment on PR when contract test fails
        if: steps.contract_test.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          CONTRACT_TEST_OUTPUT: ${{ steps.contract_test.outputs.output }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- contract-test-failure -->';
            const output = process.env.CONTRACT_TEST_OUTPUT || '';
            const trimmedOutput = output.split('\n').slice(-40).join('\n');
            const body = [
              marker,
              '',
              '## Contract test failed',
              '',
              'The telemetry emitted by this PR no longer matches the committed contract in `registry/registry.yaml`.',
              '',
              '### What to do next',
              '',
              '1. Run `make live-check` locally.',
              '2. Review the instrumentation change against `registry/registry.yaml`.',
              '3. If the contract changed intentionally, update the registry in the same PR.',
              '',
              '### Why this check exists',
              '',
              '- The app can still build and run while telemetry silently drifts.',
              '- This CI check protects schema compatibility during instrumentation migrations.',
              '',
              '### Output',
              '',
              '```text',
              trimmedOutput,
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail job if contract test failed
        if: steps.contract_test.outputs.exit_code != '0'
        run: exit 1
