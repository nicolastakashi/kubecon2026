name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linters
        run: make lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  e2e-contract:
    name: Telemetry Migration Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run telemetry checks across instrumentation modes
        id: telemetry
        run: |
          set +e

          FAILURES=0
          REPORT_FILE=$(mktemp)
          {
            echo "## Telemetry Migration Report"
            echo ""
            echo "| Mode | Status |"
            echo "| --- | --- |"
          } > "$REPORT_FILE"

          for MODE in manual-prom generated-prom generated-otel; do
            echo "Running live-check for $MODE"
            OUTPUT=$(INSTRUMENTATION_MODE="$MODE" make live-check 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"

            if [ "$EXIT_CODE" -eq 0 ]; then
              STATUS="pass"
              STATUS_ICON="✅"
            else
              STATUS="fail"
              STATUS_ICON="❌"
              FAILURES=1
            fi

            RESULTS=$(echo "$OUTPUT" | sed -n '/Live-Check Results/,/Live-check validation complete/p')
            {
              echo "| \`$MODE\` | $STATUS_ICON $STATUS |"
              echo ""
              echo "### \`$MODE\`"
              echo ""
              echo '```'
              echo "$RESULTS"
              echo '```'
              echo ""
            } >> "$REPORT_FILE"
          done

          SCHEMA_DIFF=$(INSTRUMENTATION_MODE=manual-prom make schema-diff-report 2>&1)
          SCHEMA_DIFF_EXIT=$?
          if [ "$SCHEMA_DIFF_EXIT" -ne 0 ]; then
            FAILURES=1
            {
              echo "## Schema Diff"
              echo ""
              echo '```text'
              echo "$SCHEMA_DIFF" | sed -n '1,200p'
              echo '```'
              echo ""
            } >> "$REPORT_FILE"
          elif [ -n "$SCHEMA_DIFF" ]; then
            {
              echo "## Schema Diff"
              echo ""
              echo '```diff'
              echo "$SCHEMA_DIFF" | sed -n '1,200p'
              echo '```'
              echo ""
            } >> "$REPORT_FILE"
          else
            {
              echo "## Schema Diff"
              echo ""
              echo "No schema diff detected."
              echo ""
            } >> "$REPORT_FILE"
          fi

          {
            echo 'report<<EOF'
            cat "$REPORT_FILE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$FAILURES" >> $GITHUB_OUTPUT
          exit 0

      - name: Update sticky PR telemetry report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.telemetry.outputs.report }}
        with:
          script: |
            const marker = '<!-- telemetry-migration-report -->';
            const report = process.env.REPORT || '';
            const body = `${marker}

            ${report}

            ### How to use this
            1. Run \`INSTRUMENTATION_MODE=<mode> make live-check\` locally to reproduce a mode-specific failure.
            2. Run \`make schema-diff-report\` to inspect schema drift before updating the registry.
            3. Keep the same schema-compatible output across modes unless the PR intentionally changes the contract.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail if telemetry checks failed
        if: steps.telemetry.outputs.exit_code != '0'
        run: exit 1
