apiVersion: apps/v1
kind: Deployment
metadata:
  name: packetsorter
  namespace: packetsorter
  labels:
    app: packetsorter
    app.kubernetes.io/name: packetsorter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: packetsorter
  template:
    metadata:
      labels:
        app: packetsorter
        app.kubernetes.io/name: packetsorter
    spec:
      containers:
      - name: packetsorter
        image: packetsorter:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DB_PATH
          value: /data/parcels.db
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: packetsorter
  namespace: packetsorter
  labels:
    app: packetsorter
    app.kubernetes.io/name: packetsorter
spec:
  selector:
    app: packetsorter
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
