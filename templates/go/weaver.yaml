params:
  package_name: metrics

templates:
  - template: metrics.go.j2
    application_mode: single
    file_name: "metrics.go"

acronyms: [TLS, RTT, DNS, SHA]

comment_formats:
  go:
    format: markdown
    prefix: "// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    remove_trailing_dots: true
  go_1tab:
    format: markdown
    prefix: "	// "
    indent_first_level_list_items: true
    shortcut_reference_link: true
    trim: true
    word_wrap:
      line_length: 80
default_comment_format: go

text_maps:
  prom_instrument_vec:
    counter: CounterVec
    histogram: HistogramVec
    updowncounter: GaugeVec
    gauge: GaugeVec
  prom_instrument_opts:
    counter: CounterOpts
    histogram: HistogramOpts
    updowncounter: GaugeOpts
    gauge: GaugeOpts